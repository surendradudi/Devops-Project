
version: "3.8"

services:

  frontend:
    image: yourdockerusername/ecommerce-frontend:v1
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - ecommerce-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

  backend:
    image: yourdockerusername/ecommerce-backend:v1
    environment:
      PORT: 5000
      DB_HOST: db
      DB_NAME: ecommerce
      DB_USER: ecommerce_user
    secrets:
      - db_password
    networks:
      - ecommerce-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ecommerce-db-data:/var/lib/postgresql/data
      - ecommerce-init:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ecommerce-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  ecommerce-network:
    driver: overlay
    attachable: true

volumes:
  ecommerce-db-data:
    external: true

secrets:
  db_password:
    external: true

configs:
  ecommerce-init:
    file: ./database/init.sql


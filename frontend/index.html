<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#products">Products</a>
      <a href="#cart">Cart (<span id="count">0</span>)</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to ShopEasy</h2>
    <p>Discover products at amazing prices.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <main>
    <section id="products">
      <h2>Our Products</h2>
      <div id="product-list" class="products"></div>
    </section>

    <section id="cart">
      <h2>Shopping Cart</h2>
      <div id="cart-items"></div>
      <h3>Total: ₹<span id="total">0</span></h3>
      <button onclick="checkout()">Place Order</button>
      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>© 2026 ShopEasy E-Commerce</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
